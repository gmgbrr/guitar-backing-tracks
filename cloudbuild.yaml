# Deploy contínuo: a cada push na main o Cloud Build executa este arquivo.
# Sem Dockerfile: a imagem é gerada pelos buildpacks do Google (detectam Node, rodam
# `npm ci`, `npm run build` e iniciam com `npm start`).

substitutions:
  _REGION: us-east1
  _SERVICE: stem
  _IMAGE: us-east1-docker.pkg.dev/${PROJECT_ID}/backing-tracks/app
  _APP_HOST: stem-251094340671.us-east1.run.app

steps:
  - id: build
    name: gcr.io/k8s-skaffold/pack
    entrypoint: pack
    args:
      - build
      - ${_IMAGE}:${SHORT_SHA}
      - --builder=gcr.io/buildpacks/builder:latest
      - --network=cloudbuild
      - --publish
      - --env=GOOGLE_NODE_RUN_SCRIPTS=build

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${SHORT_SHA}
      - --region=${_REGION}
      - --service-account=backing-tracks-api@${PROJECT_ID}.iam.gserviceaccount.com
      - --no-allow-unauthenticated
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=1
      - --concurrency=40
      - --timeout=300
      - --set-env-vars=^|^STORAGE_DRIVER=gcp|GCP_PROJECT=${PROJECT_ID}|GCS_BUCKET=${PROJECT_ID}-media|GCP_SIGNER_SA=none|HOST=0.0.0.0|TRUST_PROXY=1|ALLOWED_ORIGINS=https://${_APP_HOST}|ALLOWED_HOSTS=${_APP_HOST}

options:
  logging: CLOUD_LOGGING_ONLY
